[project]
name = "sprout-mcp"
version = "0.1.0"
description = "MCP server exposing the Sprout Social Reporting API"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
sprout-mcp = "sprout_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sprout_mcp"]
